name: Train SkillSensAI Music AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train music AI model
        run: |
          python train_model.py

      - name: Check generated model
        run: |
          ls -lh music_model.joblib

      - name: Commit trained model
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/music_model.joblib

          git diff --cached --quiet || git commit -m "Update trained music AI model"

          git push
